<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up | University Library</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="topbar">
      <div class="container topbar-inner">
        <div>Join the Annamacharya University Library</div>
        <div class="topbar-links">
          <a href="index.html">Home</a>
          <a href="login.html">Already a member</a>
        </div>
      </div>
    </div>

    <main class="section">
      <div class="auth-panel">
        <h2 style="margin-bottom: 20px; color: var(--primary-dark);">Create Your Account</h2>
        <div id="signupAlert" class="alert-box"></div>
        <form id="signupForm" class="form-wrap">
          <div>
            <label for="signupName">Full Name</label>
            <input id="signupName" class="form-control" type="text" placeholder="Your full name" required />
          </div>
          <div>
            <label for="signupEmail">University Email</label>
            <input id="signupEmail" class="form-control" type="email" placeholder="name@university.edu" required />
          </div>
          <div>
            <label for="signupPassword">Password</label>
            <input id="signupPassword" class="form-control" type="password" placeholder="Create a password" required />
          </div>
          <button type="submit" class="btn btn-primary" style="width: 100%;">Register</button>
        </form>
        <div class="auth-small">
          Already registered? <a href="login.html" class="btn-link">Login</a>
        </div>
      </div>
    </main>

    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/chatbot.js"></script>
  </body>
</html>
