<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Annamacharya University Library</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="topbar">
      <div class="container topbar-inner">
        <div>Annamacharya University Library Portal</div>
        <div class="topbar-links">
          <a href="index.html">Home</a>
          <a href="signup.html">Create account</a>
        </div>
      </div>
    </div>

    <main class="section">
      <div class="auth-panel">
        <h2 style="margin-bottom: 20px; color: var(--primary-dark);">Library Login</h2>
        <div id="loginAlert" class="alert-box"></div>
        <form id="loginForm" class="form-wrap">
          <div>
            <label for="loginName">Full Name</label>
            <input id="loginName" class="form-control" type="text" placeholder="Enter your name" required />
          </div>
          <div>
            <label for="loginPassword">Password</label>
            <input id="loginPassword" class="form-control" type="password" placeholder="Enter your password" required />
          </div>
          <button type="submit" class="btn btn-primary" style="width: 100%;">Login</button>
        </form>
        <div class="auth-small">
          Need an account? <a href="signup.html" class="btn-link">Sign Up</a>
        </div>
      </div>
    </main>

    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/chatbot.js"></script>
  </body>
</html>
